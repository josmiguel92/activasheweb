<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
  <title>Administración · ActivaShe</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <!--
    Decap CMS, sucesor mantenido de Netlify CMS (que quedó sin
    mantenimiento en 2022). La versión va fijada a propósito: un rango
    abierto deja que el panel cambie solo. Para actualizar, cambia el número
    aquí, abre /admin en local (ver local_backend en config.yml) y comprueba
    que las colecciones y los bloques del editor siguen funcionando.

    El backend es GitHub con open authoring: no interviene Netlify Identity,
    por eso no se carga su widget.
  -->
  <script src="https://unpkg.com/decap-cms@3.16.1/dist/decap-cms.js"></script>
  <script>
    // Hoja de estilos del panel de vista previa: reproduce la tipografía y
    // los colores de un artículo del sitio.
    CMS.registerPreviewStyle("/admin/cms.css");
  </script>
  <!-- Bloques insertables en el cuerpo: imagen con pie, vídeo, botón. -->
  <script src="/admin/editor-components.js"></script>
  <!-- Campo «Dirección (slug)»: bloqueado en las entradas ya guardadas. -->
  <script src="/admin/campo-direccion.js"></script>
  <!-- Campo «Proyecto»: el desplegable de siempre, sin rastro en la vista previa. -->
  <script src="/admin/campo-proyecto.js"></script>
</body>
</html>
