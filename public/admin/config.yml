backend:
  name: github
  repo: josmiguel92/activasheweb
  branch: main
  squash_merges: true
  open_authoring: true

# Permite abrir /admin contra el repositorio local, sin tocar GitHub:
#   terminal 1 -> npm run cms   (proxy en modo git, puerto 8081)
#   terminal 2 -> npm run dev   y abrir http://localhost:3000/admin/index.html
# Tiene que ser el modo git: con el flujo editorial activo, el modo fichero
# no llega a guardar.
local_backend: true

publish_mode: editorial_workflow
media_folder: public/images
public_folder: /images
site_url: "https://activashecuba.org"
display_url: "https://activashecuba.org"
logo_url: "https://activashecuba.org/favicon.png"
locale: es

# El nombre del fichero se convierte en parte de la URL. Sin acentos ni signos.
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: post
    label: Publicaciones
    label_singular: Publicación
    description: "Artículos del blog. Se ven en /posts."
    folder: src/content/posts
    create: true
    format: frontmatter
    identifier_field: title
    # El fichero se nombra con el campo «slug», así el nombre y la URL coinciden.
    slug: "{{fields.slug}}"
    preview_path: "posts/{{slug}}"
    summary: "{{title}}"
    sortable_fields: [publishedAt, title]
    fields:
      - { name: title, label: Título, widget: string }
      - name: slug
        label: Dirección (slug)
        widget: string
        hint: "Parte final de la URL: /posts/mi-articulo. Solo minúsculas, números y guiones. No cambiarlo una vez publicado: rompe los enlaces compartidos."
        pattern:
          ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Solo minúsculas, números y guiones."]
      - name: description
        label: Descripción
        widget: text
        hint: "Una o dos frases. Es lo que aparece en la tarjeta del listado, en Google y al compartir en redes."
      # Guardada siempre como YYYY-MM-DD y elegida en un calendario:
      # desde el panel no se puede escribir una fecha con otro formato.
      - name: publishedAt
        label: Fecha
        widget: datetime
        date_format: "DD/MM/YYYY"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true
      - name: image
        label: Imagen de portada
        widget: image
        required: false
        hint: "Opcional. También es la imagen que se ve al compartir el enlace. Horizontal, ancho de 1200 px basta."
      - {
          name: isPublish,
          label: "Publicado",
          widget: boolean,
          default: true,
          hint: "Desmárcalo para retirar la entrada del sitio sin borrarla.",
        }
      - {
          name: isDraft,
          label: "Borrador",
          widget: boolean,
          default: false,
          required: false,
        }
      - name: body
        label: Contenido
        widget: markdown
        hint: "Con el botón + puedes insertar una imagen con pie de foto, un vídeo de YouTube o un botón."

  - name: project
    label: Proyectos
    label_singular: Proyecto
    description: "Líneas de trabajo de ActivaShe. Se ven en /projects."
    folder: src/content/projects
    create: true
    format: frontmatter
    identifier_field: title
    slug: "{{fields.slug}}"
    preview_path: "projects/{{slug}}"
    summary: "{{title}}"
    sortable_fields: [publishedAt, title]
    fields:
      - { name: title, label: Título, widget: string }
      - name: slug
        label: Dirección (slug)
        widget: string
        hint: "Parte final de la URL: /projects/mi-proyecto. Solo minúsculas, números y guiones."
        pattern:
          ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Solo minúsculas, números y guiones."]
      - { name: description, label: Descripción, widget: text }
      # Guardada siempre como YYYY-MM-DD y elegida en un calendario:
      # desde el panel no se puede escribir una fecha con otro formato.
      - name: publishedAt
        label: Fecha
        widget: datetime
        date_format: "DD/MM/YYYY"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true
      - name: image
        label: Imagen de portada
        widget: image
        required: false
        hint: "Se usa en la tarjeta del listado y al compartir el enlace."
      - name: areas
        label: Áreas
        widget: select
        multiple: true
        required: false
        options:
          [
            "Investigación",
            "Derechos Humanos",
            "Educación",
            "Incidencia",
            "Arte y Cultura",
            "Salud",
            "Seguridad Alimentaria",
            "Justicia Social",
          ]
      - {
          name: isComingSoon,
          label: "Próximamente",
          widget: boolean,
          default: false,
          required: false,
          hint: "Muestra la etiqueta «Próximo» en lugar de «Activo».",
        }
      - {
          name: showDonate,
          label: "Mostrar botón de donación",
          widget: boolean,
          default: false,
          required: false,
          hint: "Añade al final del proyecto una llamada a colaborar.",
        }
      - { name: isPublish, label: "Publicado", widget: boolean, default: true }
      - {
          name: isDraft,
          label: "Borrador",
          widget: boolean,
          default: false,
          required: false,
        }
      - { name: body, label: Contenido, widget: markdown }

  - name: video
    label: Vídeos
    label_singular: Vídeo
    description: "Vídeos de YouTube que se muestran en /gallery."
    folder: src/content/videos
    create: true
    format: frontmatter
    identifier_field: title
    preview_path: "gallery"
    summary: "{{title}}"
    sortable_fields: [publishedAt, title]
    fields:
      - { name: title, label: Título, widget: string }
      - { name: description, label: Descripción, widget: text, required: false }
      - name: youtubeId
        label: "ID del vídeo de YouTube"
        widget: string
        hint: "Solo el identificador, no la URL entera. En https://youtu.be/hxmU3JqHvCs el ID es hxmU3JqHvCs."
        pattern:
          [
            "^[A-Za-z0-9_-]{11}$",
            "Son 11 caracteres: letras, números, guion o guion bajo.",
          ]
      - name: category
        label: Categoría
        widget: select
        options:
          [
            "entrevistas",
            "talleres",
            "documentales",
            "eventos",
            "educación",
            "video arte",
          ]
      - name: duration
        label: Duración
        widget: string
        hint: "Formato m:ss o h:mm:ss. Por ejemplo 1:05."
        pattern: ["^[0-9]{1,2}:[0-9]{2}(:[0-9]{2})?$", "Formato m:ss o h:mm:ss."]
      # Guardada siempre como YYYY-MM-DD y elegida en un calendario:
      # desde el panel no se puede escribir una fecha con otro formato.
      - name: publishedAt
        label: Fecha
        widget: datetime
        date_format: "DD/MM/YYYY"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true
      - {
          name: featured,
          label: Destacado,
          widget: boolean,
          default: false,
          required: false,
          hint: "El vídeo destacado se muestra grande arriba de la galería. Marca solo uno.",
        }
      - name: thumbnail
        label: Miniatura propia
        widget: image
        required: false
        hint: "Opcional. Si se deja vacío se usa la miniatura de YouTube."
      - {
          name: isPublish,
          label: "Publicado",
          widget: boolean,
          default: true,
          hint: "Desmárcalo para retirar el contenido del sitio sin borrarlo.",
        }
      - {
          name: isDraft,
          label: "Borrador",
          widget: boolean,
          default: false,
          required: false,
        }
      - { name: body, label: Contenido, widget: markdown, required: false }

  - name: art
    label: Galería de arte
    label_singular: Obra
    description: "Obras de la galería. Se ven en /gallery y cada una en su propia página."
    folder: src/content/art
    create: true
    format: frontmatter
    identifier_field: title
    preview_path: "gallery/{{slug}}"
    summary: "{{title}}"
    sortable_fields: [title, artist, year]
    fields:
      - { name: title, label: Título de la obra, widget: string }
      - name: artist
        label: Autoría
        widget: string
        required: false
        hint: "Quién creó la obra. Déjalo vacío si no se conoce: la ficha no lo muestra en ese caso."
      - name: description
        label: Descripción
        widget: text
        required: false
        hint: "Opcional: técnica, contexto, dedicatoria. Por ejemplo «acrílico sobre lienzo»."
      - { name: image, label: Imagen, widget: image }
      - name: category
        label: Categoría
        widget: select
        options: ["pintura", "fotografía", "escultura", "digital", "artesanía"]
      - {
          name: year,
          label: Año,
          widget: number,
          required: false,
          value_type: int,
          min: 1900,
          max: 2100,
        }
      - {
          name: isPublish,
          label: "Publicado",
          widget: boolean,
          default: true,
          hint: "Desmárcalo para retirar el contenido del sitio sin borrarlo.",
        }
      - {
          name: isDraft,
          label: "Borrador",
          widget: boolean,
          default: false,
          required: false,
        }
      - { name: body, label: Contenido, widget: markdown, required: false }

  # Textos de las páginas fijas. No son entradas nuevas: son tres ficheros
  # concretos, cada uno con los textos de una página ya maquetada. La
  # estructura (colores, iconos, tarjetas) sigue en el .astro; aquí solo se
  # cambian las palabras. En los textos, **así** sale en negrita.
  - name: pages
    label: Páginas fijas
    label_singular: Página
    # La vista previa genérica de Decap solo listaría los campos; la página
    # de verdad se ve con «Ver publicación», que apunta a preview_path.
    editor:
      preview: false
    files:
      - name: about
        label: Quiénes somos
        file: src/content/pages/about.json
        preview_path: about
        fields:
          - {
              name: title,
              label: Título para buscadores,
              widget: string,
              hint: "Aparece en la pestaña del navegador y como titular en Google. Si es corto se le añade « | ActivaShe » automáticamente.",
            }
          - {
              name: seoDescription,
              label: Descripción para buscadores,
              widget: text,
              hint: "Una o dos frases. Es lo que aparece bajo el título en Google y al compartir el enlace.",
            }
          - { name: heading, label: Titular, widget: string }
          - {
              name: headingHighlight,
              label: Última palabra del titular,
              widget: string,
              required: false,
              hint: "Se pinta subrayada en mostaza. Déjalo vacío si no quieres resalte.",
            }
          - name: intro
            label: Párrafos de entrada
            widget: list
            required: false
            field: { name: texto, label: Párrafo, widget: text }
          - name: sections
            label: Secciones
            widget: list
            required: false
            label_singular: Sección
            summary: "{{fields.heading}}"
            fields:
              - {
                  name: heading,
                  label: Título de la sección,
                  widget: string,
                  required: false,
                }
              - name: paragraphs
                label: Párrafos
                widget: list
                required: false
                field: { name: texto, label: Párrafo, widget: text }
              - name: cards
                label: Tarjetas
                widget: list
                required: false
                label_singular: Tarjeta
                summary: "{{fields.text}}"
                fields:
                  - {
                      name: icon,
                      label: Icono,
                      widget: string,
                      hint: "Nombre del icono en Material Symbols, por ejemplo handshake, school, palette o stars. Catálogo en fonts.google.com/icons.",
                    }
                  - { name: text, label: Texto, widget: text }
          - name: closing
            label: Párrafos de cierre
            widget: list
            required: false
            field: { name: texto, label: Párrafo, widget: text }

      - name: donate
        label: Colabora
        file: src/content/pages/donate.json
        preview_path: donate
        fields:
          - {
              name: title,
              label: Título para buscadores,
              widget: string,
              hint: "Aparece en la pestaña del navegador y como titular en Google. Si es corto se le añade « | ActivaShe » automáticamente.",
            }
          - { name: seoDescription, label: Descripción para buscadores, widget: text }
          - { name: heading, label: Titular, widget: string }
          - {
              name: headingHighlight,
              label: Última palabra del titular,
              widget: string,
              required: false,
            }
          - name: intro
            label: Párrafos de entrada
            widget: list
            required: false
            field: { name: texto, label: Párrafo, widget: text }
          - name: aside
            label: Recuadro destacado
            widget: object
            required: false
            fields:
              - { name: title, label: Título del recuadro, widget: string, required: false }
              - { name: text, label: Texto del recuadro, widget: text, required: false }
              - {
                  name: showEmail,
                  label: "Mostrar el correo de contacto",
                  widget: boolean,
                  default: true,
                  required: false,
                  hint: "El correo se toma de src/data/presentation.ts.",
                }
          - name: closing
            label: Párrafos de cierre
            widget: list
            required: false
            field: { name: texto, label: Párrafo, widget: text }

      - name: podcasts
        label: Podcasts
        file: src/content/pages/podcasts.json
        preview_path: podcasts
        fields:
          - {
              name: title,
              label: Título para buscadores,
              widget: string,
              hint: "Aparece en la pestaña del navegador y como titular en Google. Si es corto se le añade « | ActivaShe » automáticamente.",
            }
          - { name: seoDescription, label: Descripción para buscadores, widget: text }
          - { name: heading, label: Titular, widget: string }
          - {
              name: headingHighlight,
              label: Última palabra del titular,
              widget: string,
              required: false,
            }
          - name: intro
            label: Párrafos de entrada
            widget: list
            required: false
            field: { name: texto, label: Párrafo, widget: text }
          - name: aside
            label: Recuadro destacado
            widget: object
            required: false
            fields:
              - { name: title, label: Título del recuadro, widget: string, required: false }
              - { name: text, label: Texto del recuadro, widget: text, required: false }
              - {
                  name: showEmail,
                  label: "Mostrar el correo de contacto",
                  widget: boolean,
                  default: false,
                  required: false,
                }
          - name: closing
            label: Párrafos de cierre
            widget: list
            required: false
            field: { name: texto, label: Párrafo, widget: text }
